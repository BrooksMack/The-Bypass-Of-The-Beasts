[package]
name = "vm-setup-assistant"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Friendly desktop assistant that sets up a Windows 11 virtual machine with Oracle VirtualBox"

[lib]
name = "vm_setup_assistant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
vmsa-core = { path = "../crates/vmsa-core" }
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.6"
tauri-plugin-opener = "2.6"
tauri-plugin-single-instance = "2.5"
tauri-plugin-log = "2.10"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
log = "0.4"
chrono.workspace = true
uuid.workspace = true
