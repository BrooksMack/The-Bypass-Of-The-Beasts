name: Apple Silicon preview

on:
  push:
    branches: ["fix/mac-setup-recovery"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mac-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build Apple Silicon installer
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: apple-silicon-preview
      - run: npm ci
      - run: npm run check:version
      - run: npm test
      - run: npm run build
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build Apple Silicon DMG
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: npm run tauri -- build --target aarch64-apple-darwin --bundles dmg
      - name: Record checksums and build identity
        run: |
          mkdir -p preview
          cp target/aarch64-apple-darwin/release/bundle/dmg/*.dmg preview/
          printf 'Commit: %s\nApple Silicon only. Ad-hoc signed preview, not notarized.\nPhysical camera, microphone and Windows installation require testing on your Mac.\n' "$GITHUB_SHA" > preview/BUILD.txt
          cd preview
          shasum -a 256 *.dmg > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Apple-Silicon-preview
          path: preview/*
          if-no-files-found: error
          retention-days: 30
